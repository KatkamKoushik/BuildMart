name: API CI (FastAPI)

on:
  push:
    branches: [ main, master, 'feat/**' ]
    paths:
      - 'services/api/**'
      - '.github/workflows/ci-api.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'services/api/**'
      - '.github/workflows/ci-api.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    name: Pytest & Migrations FastAPI API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buildmart_user
          POSTGRES_PASSWORD: buildmart_secure_pass
          POSTGRES_DB: buildmart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi

      - name: Run Alembic Migrations against PostgreSQL 16
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://buildmart_user:buildmart_secure_pass@localhost:5432/buildmart_test

      - name: Seed Database against PostgreSQL 16
        run: python -m app.seed
        env:
          DATABASE_URL: postgresql+asyncpg://buildmart_user:buildmart_secure_pass@localhost:5432/buildmart_test

      - name: Run Pytest Suite
        run: python -m pytest -v --tb=short
        env:
          PYTHONPATH: .
          TESTING: "true"
          TEST_DATABASE_URL: postgresql+asyncpg://buildmart_user:buildmart_secure_pass@localhost:5432/buildmart_test
