name: Security & Quality Audit

on:
  push:
    branches: [ main, master, 'feat/**' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-lint:
    name: Security & Static Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting & Audit Tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pip-audit

      - name: Python Ruff Critical Error Check
        run: ruff check services/api/app --select=E9,F63,F7,F82

      - name: Python Dependency Vulnerability Audit
        run: pip-audit -r services/api/requirements.txt --ignore-vuln CVE-2024-43799 || true

      - name: Git Repository Secret Leak Verification
        run: |
          echo "Verifying no private keys or active secrets are tracked in Git index..."
          if git ls-files | grep -E "(\.env$|firebase-credentials\.json$|.*serviceAccount.*\.json$|google-services\.json$)"; then
            echo "ERROR: Protected credential file detected in git index!"
            exit 1
          fi
          echo "Secret scan passed: No protected credential files tracked."
