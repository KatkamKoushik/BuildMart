name: Mobile CI (Flutter)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter_ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter_ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Test & Validate Mobile App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-${{ hashFiles('mobile/pubspec.lock') }}"

      - name: Prepare Clean-Checkout Environment (.env)
        run: |
          echo "Preparing safe environment configuration from .env.example..."
          cp .env.example .env
          test -f .env && echo ".env successfully instantiated for asset bundling"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Run Flutter Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Test Suite
        run: flutter test --coverage

  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    needs: validate-and-test
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Clean-Checkout Environment (.env)
        run: |
          echo "Preparing safe environment configuration from .env.example..."
          cp .env.example .env
          test -f .env && echo ".env successfully instantiated for asset bundling"

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Flutter APK Build (Debug)
        run: flutter build apk --debug --android-skip-build-dependency-validation
