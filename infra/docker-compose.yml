services:
  db:
    image: postgres:16-alpine
    container_name: buildmart-postgres
    restart: unless-stopped
    networks:
      - buildmart-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buildmart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildmart_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-buildmart}
    ports:
      # Bound strictly to loopback interface for security (prevent public internet exposure)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildmart_user} -d ${POSTGRES_DB:-buildmart}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: buildmart-redis
    restart: unless-stopped
    networks:
      - buildmart-net
    ports:
      # Bound strictly to loopback interface
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: buildmart-api
    restart: unless-stopped
    networks:
      - buildmart-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-buildmart_user}:${POSTGRES_PASSWORD:-buildmart_secure_pass}@db:5432/${POSTGRES_DB:-buildmart}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?FATAL: SECRET_KEY must be provided in production}
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:?FATAL: ADMIN_BOOTSTRAP_SECRET must be provided in production}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: buildmart-web
    restart: unless-stopped
    networks:
      - buildmart-net
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      PORT: 3000
    ports:
      - "3000:3000"

networks:
  buildmart-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
